[tool.poetry]
name = "rag-reference-checker"
version = "0.1.0"
description = "验证 RAG 系统引用真实性的工具"
authors = ["Chance Dean <novelnexusai@outlook.com>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "rag_reference_checker", from = "src"}]

[tool.poetry.dependencies]
python = "^3.8"
sentence-transformers = "^2.2.0"
numpy = "^1.24.0"
click = "^8.1.0"
rich = "^13.0.0"
torch = {version = "^2.0.0", optional = true}
transformers = {version = "^4.30.0", optional = true}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.0.0"
ruff = "^0.1.0"

[tool.poetry.scripts]
rag-reference-checker = "rag_reference_checker.cli:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
